# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: alloma-ai
    runtime: node
    plan: free
    # O'zbekistonga eng yaqin Render mintaqasi
    region: frankfurt
    # Build uchun devDependencies (typescript, esbuild) kerak, shuning uchun --include=dev
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: "*"
      # Maxfiy kalitlar — qiymatlari Render panelida (Environment) kiritiladi, git'ga yozilmaydi.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
